name: cleaning_service
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      APP_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  web:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}
      DJANGO_TRUST_PROXY: 'True'
      DJANGO_HTTPS: 'True'
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-3600}
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-False}
      DJANGO_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-False}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-webmaster@localhost}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    networks: [frontend, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /app/deploy/healthcheck.py]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 90s
    logging: *logging

  nginx:
    build: ./deploy/nginx
    restart: unless-stopped
    init: true
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      TLS_MODE: ${TLS_MODE:-local}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - certificates:/etc/letsencrypt
      - acme_data:/var/www/acme
    networks: [frontend]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz && test -f /tmp/tls-ready && openssl x509 -checkend 86400 -noout -in /etc/letsencrypt/active/fullchain.pem']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

volumes:
  postgres_data:
  static_data:
  media_data:
  certificates:
  acme_data:

networks:
  frontend:
  database:
    internal: true
